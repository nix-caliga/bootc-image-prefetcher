name: update-pins

on:
    schedule:
        - cron: "0 4 * * *"
    workflow_dispatch:

permissions:
    contents: write
    packages: write

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: jlumbroso/free-disk-space@main
            - uses: cachix/install-nix-action@v31
              with:
                  extra_nix_config: experimental-features = nix-command flakes
            - run: |
                  set -uo pipefail
                  echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
                  nix run ./updater#update || failed=1

                  # commit whatever pins changed
                  mkdir -p pins
                  git add pins
                  if ! git diff --cached --quiet; then
                    git config user.name 'github-actions[bot]'
                    git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                    git commit -m 'chore: update bootc image pins'
                    git push origin HEAD:${{ github.ref_name }}
                  fi

                  # mark failed if any image failed (but commit the rest)
                  [ -z "${failed:-}" ] || exit 1

            - name: prune untagged images older than 14 days
              if: ${{ !cancelled() }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -uo pipefail
                  base=$(gh api "users/$GITHUB_REPOSITORY_OWNER" --jq 'if .type == "Organization" then "orgs" else "users" end')/$GITHUB_REPOSITORY_OWNER
                  gh api --paginate "$base/packages?package_type=container" \
                    --jq ".[] | select(.repository.full_name == \"$GITHUB_REPOSITORY\") | .name | @uri" |
                  while read -r pkg; do
                    # skip currently tagged images
                    gh api --paginate "$base/packages/container/$pkg/versions" \
                      --jq '.[] | select(.metadata.container.tags == [] and (.created_at | fromdate) < now - 14*86400) | .id' |
                    while read -r id; do
                      echo "deleting $pkg version $id"
                      gh api -X DELETE "$base/packages/container/$pkg/versions/$id" || echo "::warning::failed to delete $pkg $id"
                    done
                  done

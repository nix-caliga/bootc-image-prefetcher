name: update-pins

on:
    schedule:
        - cron: "0 4 * * *"
    workflow_dispatch:

permissions:
    contents: write
    packages: write

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: jlumbroso/free-disk-space@cf1e78c50ca91e757bab3edc229027eebfc07871
            - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
              with:
                  extra_nix_config: experimental-features = nix-command flakes
            - run: |
                  set -uo pipefail
                  echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
                  nix run ./updater#update || failed=1

                  # commit whatever pins changed
                  mkdir -p pins
                  git add pins
                  if ! git diff --cached --quiet; then
                    git config user.name 'github-actions[bot]'
                    git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                    git commit -m 'chore: update bootc image pins'
                    git push origin HEAD:${{ github.ref_name }}
                  fi

                  # mark failed if any image failed (but commit the rest)
                  [ -z "${failed:-}" ] || exit 1

            - name: cleanup old images
              if: ${{ !cancelled() }}
              uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b
              with:
                  packages: bootc-image-prefetcher/fedora-bootc
                  delete-untagged: true
                  older-than: 14 days
                  dry-run: true
